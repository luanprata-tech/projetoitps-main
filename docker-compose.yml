services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Garante que o PostgreSQL já aceita conexões antes de rodar migrations no backend.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Monta a pasta de rede SMB/CIFS (\\172.23.6.7\geprocon\ProjetosITPS) em /storage no backend.
      - storage_projetos:/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  storage_projetos:
    driver: local
    driver_opts:
      type: cifs
      device: "${SMB_SHARE_DEVICE}"
      o: "addr=${SMB_HOST},username=${SMB_USERNAME},password=${SMB_PASSWORD},${SMB_OPTIONS}"
